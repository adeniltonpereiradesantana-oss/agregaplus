<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Agrega+</title>
  <meta name="description" content="Agrega+ · lançamentos, fechamento e pagamento de agregados">
  <meta name="theme-color" content="#0F1217">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232350C2'/%3E%3Cpath d='M6 11h12v10H6zM18 15h4l4 4v2h-8z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='22' r='2' fill='white'/%3E%3Ccircle cx='22' cy='22' r='2' fill='white'/%3E%3C/svg%3E">
  <style>
    :root { --fundo: #0F1217; --azul: #2350C2; --azul-2: #4A78EE; --laranja: #E8913A; --texto: #E7EAF0; --texto-2: #9AA3B1; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--fundo); color: var(--texto); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }

    /* ===== abertura ===== */
    .abertura {
      position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; overflow: hidden;
      background:
        radial-gradient(60% 50% at 50% 38%, rgba(74, 120, 238, .22), transparent 70%),
        radial-gradient(40% 35% at 80% 90%, rgba(232, 145, 58, .10), transparent 70%),
        var(--fundo);
      transition: opacity .6s ease, visibility .6s;
    }
    .abertura.saindo { opacity: 0; visibility: hidden; }
    .caixa { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 28px; }

    .marca { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: subir .8s cubic-bezier(.2, .8, .2, 1) both; }
    .icone {
      width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(145deg, var(--azul-2), var(--azul)); position: relative;
      box-shadow: 0 18px 50px rgba(35, 80, 194, .45), inset 0 1px 0 rgba(255, 255, 255, .25);
    }
    .icone::after { content: ""; position: absolute; inset: -10px; border-radius: 26px; border: 2px solid rgba(74, 120, 238, .45); animation: pulso 2.2s ease-out infinite; }
    .nome { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
    .nome span { color: var(--azul-2); }
    .sub { font-size: 15px; color: var(--texto-2); margin-top: -6px; }

    /* estrada com o caminhão */
    .estrada { position: relative; width: 100%; height: 92px; animation: subir .8s .15s cubic-bezier(.2, .8, .2, 1) both; }
    .asfalto { position: absolute; left: 0; right: 0; bottom: 14px; height: 4px; border-radius: 4px; background: #262D3A; overflow: hidden; }
    .asfalto::before {
      content: ""; position: absolute; inset: 0; width: 200%;
      background: repeating-linear-gradient(90deg, #5B6472 0 26px, transparent 26px 52px);
      animation: faixa .9s linear infinite;
    }
    .caminhao { position: absolute; bottom: 16px; left: 0; width: 120px; animation: rodar 3.6s cubic-bezier(.45, .05, .55, .95) infinite; }
    .caminhao svg { display: block; width: 120px; height: auto; animation: balanco .35s ease-in-out infinite alternate; }
    .roda { transform-box: fill-box; transform-origin: center; animation: girar .5s linear infinite; }
    .poeira { position: absolute; bottom: 4px; left: -6px; width: 10px; height: 10px; border-radius: 50%; background: rgba(154, 163, 177, .35); animation: poeira .7s ease-out infinite; }
    .poeira.p2 { animation-delay: .23s; } .poeira.p3 { animation-delay: .46s; }

    /* barra de progresso */
    .progresso { width: 100%; max-width: 360px; height: 6px; border-radius: 6px; background: #1C212A; overflow: hidden; animation: subir .8s .3s both; }
    .progresso i { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--azul), var(--azul-2), var(--laranja), var(--azul-2), var(--azul)); background-size: 200% 100%;
      transition: width .5s ease; animation: brilho 1.6s linear infinite; }
    .status { min-height: 22px; font-size: 15px; color: var(--texto-2); animation: subir .8s .4s both; }
    .status b { color: var(--texto); font-weight: 600; transition: opacity .25s; }
    .direto { font-size: 14px; color: var(--texto-2); opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; pointer-events: none; }
    .direto.ver { opacity: 1; transform: none; pointer-events: auto; }
    .direto a { color: #fff; font-weight: 600; text-underline-offset: 3px; }
    .rodape { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; color: #5B6472; z-index: 3; }

    @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes pulso { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.25); } }
    @keyframes faixa { to { transform: translateX(-52px); } }
    @keyframes rodar { 0% { left: -130px; } 50% { left: calc(50% - 60px); } 100% { left: calc(100% + 10px); } }
    @keyframes balanco { from { transform: translateY(0); } to { transform: translateY(-1.5px); } }
    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes poeira { from { opacity: .8; transform: translate(0, 0) scale(.6); } to { opacity: 0; transform: translate(-26px, -10px) scale(1.6); } }
    @keyframes brilho { to { background-position: -200% 0; } }

    @media (max-width: 480px) { .nome { font-size: 28px; } .icone { width: 64px; height: 64px; border-radius: 17px; } .caminhao, .caminhao svg { width: 96px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .caminhao { left: calc(50% - 60px); }
    }
  </style>
</head>
<body>
  <!--
    Página do domínio agregaplus.com.br: abertura animada e o Agrega+ (Google Apps Script) em tela cheia.
    Troque o endereço em URL_SISTEMA pelo link /exec da implantação do Agrega+ (Implantar > Gerenciar implantações).
    Use sempre a MESMA implantação (edite e escolha "Nova versão") para o link não mudar.
  -->
  <div class="abertura" id="abertura" role="status" aria-live="polite">
    <div class="caixa">
      <div class="marca">
        <div class="icone" aria-hidden="true">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>
        </div>
        <div class="nome">Agrega+<span>+</span></div>
        <div class="sub">Lançamentos, fechamento e pagamento de agregados</div>
      </div>

      <div class="estrada" aria-hidden="true">
        <div class="asfalto"></div>
        <div class="caminhao">
          <span class="poeira"></span><span class="poeira p2"></span><span class="poeira p3"></span>
          <svg viewBox="0 0 120 56">
            <rect x="2" y="6" width="70" height="36" rx="4" fill="#2350C2"/>
            <rect x="2" y="6" width="70" height="9" rx="4" fill="#4A78EE"/>
            <text x="37" y="31" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff">Agrega+</text>
            <path d="M74 18h22l12 13v11H74z" fill="#E7EAF0"/>
            <path d="M80 22h14l8 9H80z" fill="#9DB8FF"/>
            <rect x="74" y="38" width="34" height="4" fill="#C9CFD8"/>
            <rect x="106" y="33" width="5" height="4" rx="1" fill="#E8913A"/>
            <g class="roda"><circle cx="20" cy="46" r="8" fill="#14181F"/><circle cx="20" cy="46" r="3.2" fill="#9AA3B1"/><rect x="19" y="39" width="2" height="5" fill="#5B6472"/></g>
            <g class="roda"><circle cx="54" cy="46" r="8" fill="#14181F"/><circle cx="54" cy="46" r="3.2" fill="#9AA3B1"/><rect x="53" y="39" width="2" height="5" fill="#5B6472"/></g>
            <g class="roda"><circle cx="94" cy="46" r="8" fill="#14181F"/><circle cx="94" cy="46" r="3.2" fill="#9AA3B1"/><rect x="93" y="39" width="2" height="5" fill="#5B6472"/></g>
          </svg>
        </div>
      </div>

      <div class="progresso" aria-hidden="true"><i id="barra"></i></div>
      <div class="status"><b id="msg">Conectando ao servidor…</b></div>
      <div class="direto" id="direto">Está demorando? <a id="link-direto" href="#">Abrir o Agrega+ direto</a></div>
    </div>
  </div>
  <div class="rodape" id="rodape">agregaplus.com.br</div>

  <iframe id="app" title="Agrega+" allow="clipboard-write; camera" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <script>
    var URL_SISTEMA = 'https://script.google.com/macros/s/AKfycbxETwcIXAop71o1lbPVGtj4sQi4hl5amar88vSNERZjqb4cKuS638REWLxJYsb_BIhr/exec';

    var f = document.getElementById('app'), abertura = document.getElementById('abertura');
    var barra = document.getElementById('barra'), msg = document.getElementById('msg');
    var mensagens = ['Conectando ao servidor…', 'Buscando seus dados…', 'Organizando lançamentos…', 'Preparando o painel…', 'Quase lá…'];
    var i = 0, pct = 8, pronto = false;
    document.getElementById('link-direto').href = URL_SISTEMA;

    // a barra avança devagar até 90% enquanto espera e completa quando o sistema abre
    barra.style.width = pct + '%';
    var tique = setInterval(function () {
      if (pronto) return;
      pct = Math.min(90, pct + (90 - pct) * 0.12);
      barra.style.width = pct + '%';
    }, 400);
    var troca = setInterval(function () {
      if (pronto || i >= mensagens.length - 1) return;
      i++;
      msg.style.opacity = 0;
      setTimeout(function () { msg.textContent = mensagens[i]; msg.style.opacity = 1; }, 250);
    }, 1800);
    setTimeout(function () { if (!pronto) document.getElementById('direto').classList.add('ver'); }, 9000);

    f.addEventListener('load', function () {
      pronto = true;
      clearInterval(tique); clearInterval(troca);
      barra.style.width = '100%';
      msg.style.opacity = 1; msg.textContent = 'Pronto!';
      // dá tempo do sistema desenhar a tela de entrada por baixo
      setTimeout(function () {
        abertura.classList.add('saindo');
        document.getElementById('rodape').style.display = 'none';
        setTimeout(function () { abertura.remove(); }, 700);
      }, 900);
    });
    f.src = URL_SISTEMA;
  </script>
</body>
</html>
